<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memorilla demos</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --dim: #8b949e;
  --memorilla: #e056fd; --rag: #39c5cf; --full: #f5c542; --none: #b1bac4;
  --ok: #3fb950; --bad: #f85149; --hl: #2ea04366;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 20px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
#app { display: flex; flex-direction: column; height: 100vh; padding: 28px 36px 18px; gap: 16px; max-width: 1920px; margin: 0 auto; }
header { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 34px; color: var(--memorilla); letter-spacing: .2px; }
.sub { color: var(--dim); font-size: 19px; }
.right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.badge { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 15px; color: var(--dim); }
.badge.live { color: var(--ok); border-color: #2ea04366; }
.badge.live::before { content: "● "; }
.dots { display: flex; gap: 8px; }
.dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dots span.on { background: var(--text); } .dots span.cur { outline: 2px solid var(--memorilla); outline-offset: 2px; }
.question { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 22px; font-size: 30px; font-weight: 600; }
.question small { display: block; font-size: 16px; font-weight: 400; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
.grid { flex: 1; display: grid; gap: 16px; min-height: 0; }
.grid.c2 { grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; }
.card { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 14px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.card .head { display: flex; align-items: center; gap: 12px; padding: 12px 18px 6px; }
.card .name { font-weight: 700; color: var(--c); font-size: 22px; }
.chips { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.chip { font-size: 16px; color: var(--dim); background: #0d111799; border: 1px solid var(--line); border-radius: 8px; padding: 2px 9px; }
.mark { font-size: 24px; font-weight: 800; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
.mark.ok { color: var(--bg); background: var(--ok); } .mark.bad { color: var(--bg); background: var(--bad); }
.note { padding: 0 18px; font-size: 16px; color: var(--dim); }
.note .hit { color: var(--ok); font-weight: 700; } .note .miss { color: var(--bad); font-weight: 700; } .note .clue { color: var(--ok); font-weight: 700; }
.answer { padding: 8px 18px 14px; overflow: hidden; position: relative; flex: 1; font-size: 19px; }
.answer::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, var(--panel)); }
.answer mark { background: var(--hl); color: var(--text); border-radius: 4px; padding: 0 2px; }
.thinking { color: var(--dim); padding: 18px; font-size: 20px; }
.thinking i { display: inline-block; width: 9px; height: 9px; margin-left: 4px; border-radius: 50%; background: var(--c); animation: b 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes b { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
footer { display: flex; gap: 16px; color: var(--dim); font-size: 16px; flex-wrap: wrap; }
.reveal { color: var(--text); font-size: 18px; font-style: italic; }
table { border-collapse: collapse; width: 100%; font-size: 20px; }
th, td { padding: 9px 14px; border-bottom: 1px solid var(--line); text-align: center; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--dim); font-weight: 600; }
tr.total td { font-weight: 800; font-size: 24px; border-top: 2px solid var(--line); }
.summary { flex: 1; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 18px; }
.speed { flex: 1; display: grid; grid-template-columns: 1fr 520px; gap: 16px; min-height: 0; }
.speed td, .speed th { padding: 6px 10px; white-space: nowrap; font-size: 19px; }
.speed svg { width: 100%; height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.legend { display: flex; gap: 24px; font-size: 18px; }
.legend b { display: inline-block; width: 28px; height: 5px; border-radius: 3px; vertical-align: middle; margin-right: 8px; }
.empty { margin: auto; color: var(--dim); font-size: 24px; text-align: center; }
.logs { background: #010409; border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; height: 168px;
  overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; flex: none;
  font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #8b949e; white-space: pre; }
.logs.big { flex: 1; height: auto; font-size: 16px; }
.logs .w { color: #d29922; } .logs .e { color: var(--bad); } .logs .i b { color: #58a6ff; font-weight: 400; }
.loading { display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }
.loading .big { font-size: 34px; font-weight: 700; } .loading .big span { color: var(--memorilla); }
.help { position: fixed; right: 14px; bottom: 8px; font-size: 13px; color: #8b949e66; }
</style>
</head>
<body>
<div id="app"><div class="empty">Waiting for a demo run…<br><span class="sub">start one with make sanity / demo-clue / demo-pmv2 / demo-speed / demo-book</span></div></div>
<div class="help">← → browse · F follow · S summary · L logs · B badge · R restart replay</div>
<script>
"use strict";
const SLOTS = {
  sanity: [["none", "Qwen3-8B · no memory"], ["memorilla", "Memorilla · pmv2"]],
  clue: [["none", "No memory"], ["rag", "RAG · top-5 chats"], ["full", "Full context · every chat"], ["memorilla", "Memorilla · 16 memory tokens"]],
  pmv2: [["none", "No memory"], ["rag", "RAG · top-5 chats"], ["full", "Full context · every chat"], ["memorilla", "Memorilla · 16 memory tokens"]],
  book: [["none", "No memory"], ["rag", "RAG · top-5 passages"], ["full", "Full context · as much as fits"], ["memorilla", "Memorilla · 16 memory tokens"]],
};
const TITLES = { sanity: "Step 0 · Sanity check", clue: "The Buried Clue", pmv2: "PersonaMem-v2 · the checkpoint's own data",
  speed: "The speed race", book: "A book too big for the context window" };
let state = null, lastText = "", view = { index: null, follow: true, summary: false, badge: true, logs: true, lastCount: 0, doneAt: 0 };
let logLines = [], logOffset = 0, logFile = null, logPartial = "";
const LOGS = () => view.logs ? `<div id="logs" class="logs"></div>` : "";

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtS = s => s < 1 ? `${Math.round(s * 1000)} ms` : `${s.toFixed(2)} s`;
const fmtN = n => Number(n).toLocaleString("en-US");

function richText(text, phrases) {
  let html = esc(text.trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^#{1,6}\s*(.*)$/gm, "<b>$1</b>").replace(/\n/g, "<br>");
  for (const p of phrases || []) {
    if (!p) continue;
    const re = new RegExp(esc(p).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    html = html.replace(re, m => `<mark>${m}</mark>`);
  }
  return html;
}

function card(key, title, result, note) {
  const c = `var(--${key})`;
  if (!result) return `<div class="card" style="--c:${c}"><div class="head"><span class="name">${esc(title)}</span></div>
    <div class="thinking">thinking<i></i><i></i><i></i></div></div>`;
  const ok = result.rubric && result.rubric.pass;
  const chips = `<span class="chip mono">${fmtN(result.prompt_tokens)} tokens in</span><span class="chip mono">${fmtS(result.latency_s)}</span>
    <span class="mark ${ok ? "ok" : "bad"}">${ok ? "✓" : "✗"}</span>`;
  const body = result.error ? `<span style="color:var(--bad)">${esc(result.error)}</span>`
    : richText(result.answer, (result.rubric || {}).matched);
  return `<div class="card" style="--c:${c}"><div class="head"><span class="name">${esc(title)}</span><span class="chips">${chips}</span></div>
    ${note ? `<div class="note">${note}</div>` : ""}<div class="answer">${body}</div></div>`;
}

function chaptersOf(d, first, last) {
  if (first == null) return "nothing";
  const ch = d.inputs.passage_chapters, a = ch[first], b = ch[last];
  return a === b ? `chapter ${a}` : `chapters ${a}–${b}`;
}

function noteFor(d, i, key, r) {
  if (!r || r.error) return "";
  if (d.demo === "clue" || d.demo === "book") {
    const q = d.questions[i];
    if (key === "rag") {
      const want = d.demo === "clue" ? new Set([q.clue_chat]) : new Set(q.evidence);
      const ids = r.retrieved.map(x => x + 1);
      const hits = ids.filter(x => want.has(x)).length;
      const label = d.demo === "clue" ? (hits ? `clue #${q.clue_chat} found` : `clue #${q.clue_chat} missed`)
        : `${hits} answer passage${hits === 1 ? "" : "s"}`;
      return `retrieved ${ids.map(x => want.has(x) ? `<span class="clue">#${x}</span>` : `#${x}`).join(" ")} · <span class="${hits ? "hit" : "miss"}">${label}</span>`;
    }
    if (key === "full") {
      if (d.demo === "book") {
        const seen = chaptersOf(d, r.first_document, r.last_document);
        return r.truncated ? `<span class="miss">saw only the ${d.config.book.truncate_keep === "end" ? "last" : "first"} ${Math.round(r.fraction_seen * 100)}% of the book (${seen})</span>` : "saw the whole book";
      }
      return r.truncated ? `<span class="miss">saw only the last ${Math.round(r.fraction_seen * 100)}%</span>` : `saw all ${d.inputs.num_chats} chats`;
    }
    if (key === "memorilla") return `embedding ${fmtS(r.embed_s)} · answering ${fmtS(r.generate_s)}`;
  }
  if (d.demo === "pmv2") {
    const p = r.rubric;
    let s = `<span class="${p.pass ? "hit" : "miss"}">nearest option ${p.picked + 1} · correct is ${p.gold + 1}</span>`;
    if (key === "rag") s += ` · chats ${r.retrieved.map(x => "#" + (x + 1)).join(" ")}`;
    if (key === "memorilla") s += ` · embedding ${fmtS(r.embed_s)} · answering ${fmtS(r.generate_s)}`;
    return s;
  }
  if (d.demo === "sanity" && key === "memorilla" && r.embed_s != null) return `embedding ${fmtS(r.embed_s)} · answering ${fmtS(r.generate_s)}`;
  return "";
}

function footerHtml(d) {
  const parts = [];
  if (d.vram) parts.push(`Peak VRAM ${(d.vram.peak_used_mib / 1024).toFixed(1)} / ${(d.vram.total_mib / 1024).toFixed(1)} GiB`);
  const gpu = ((d.hardware || {}).gpu || {}).name; if (gpu) parts.push(gpu.replace("NVIDIA GeForce ", "").replace("NVIDIA ", ""));
  const sw = d.software || {}; if (sw.vllm) parts.push(`vLLM ${sw.vllm}`); if (sw.torch) parts.push(`torch ${sw.torch}`);
  return parts.map(esc).join(" · ");
}

function header(d, extra) {
  const live = state.mode === "live";
  const badge = live ? `<span class="badge live">live run</span>` : (view.badge ? `<span class="badge">recorded run · ${esc(state.file || "")}</span>` : "");
  return `<header><h1>${esc(TITLES[d.demo] || d.demo)}</h1><span class="sub">${extra || ""}</span><span class="right">${badge}</span></header>`;
}

function questionCount(d) { return d.demo === "pmv2" ? (d.rows || []).length : (d.questions || []).length; }
function answeredCount(d) { return (d.answers || []).length; }
function complete(d) {
  if (d._complete != null) return d._complete;
  const n = questionCount(d), a = d.answers || [];
  return a.length === n && n > 0 && Object.keys(a[n - 1]).length === SLOTS[d.demo].length && d.vram;
}

function renderBoard(d) {
  const n = d.demo === "pmv2" ? d.config.pmv2_check.rows : d.questions.length;
  const have = answeredCount(d);
  if (view.follow || view.index == null) view.index = Math.max(0, have - 1);
  const i = Math.min(view.index, Math.max(0, have - 1));
  const answers = (d.answers || [])[i] || {};
  let qtext, small, reveal = "";
  if (d.demo === "pmv2") {
    const row = (d.rows || [])[i];
    if (!row) return renderEmpty("Loading models…");
    qtext = row.question; small = `Test row ${row.row} · ${row.num_documents} past chats · ${fmtN(row.history_tokens)} tokens`;
    reveal = `Reference answer: ${esc(row.reference)}`;
  } else {
    const q = d.questions[i];
    qtext = q.question;
    if (d.demo === "clue") { small = `Sam asks · ${d.inputs ? d.inputs.num_chats + " past chats · " + fmtN(d.inputs.history_tokens) + " tokens" : ""}`;
      reveal = `Where the answer is: chat #${q.clue_chat} — ${esc(q.clue_summary)}`; }
    else { small = `Question · answer in chapter${q.chapters.length > 1 ? "s" : ""} ${q.chapters.join(", ")}`; reveal = `From the book: ${esc(q.answer)}`; }
  }
  let sub = "";
  if (d.demo === "book" && d.inputs) sub = `The whole book: <b style="color:var(--full)">${fmtN(d.inputs.book_tokens)} tokens</b> vs <b style="color:var(--memorilla)">16 memory tokens</b> (${fmtN(Math.round(d.inputs.book_tokens / 16))}× compression) · context window ${fmtN(d.inputs.window)}`;
  if (d.demo === "clue") sub = "same Qwen3-8B · same prompt · greedy decoding";
  if (d.demo === "pmv2") sub = "scored with the paper's own metric: nearest of 4 answer options";
  const dots = Array.from({ length: n }, (_, k) => `<span class="${k < have ? "on" : ""} ${k === i ? "cur" : ""}"></span>`).join("");
  const slots = SLOTS[d.demo];
  const allIn = slots.every(([k]) => answers[k]);
  return `${header(d, sub)}<div style="display:flex;gap:16px;align-items:center"><span class="sub">${i + 1} of ${n}</span><div class="dots">${dots}</div></div>
    <div class="question"><small>${esc(small)}</small>${esc(qtext)}</div>
    <div class="grid c2">${slots.map(([k, t]) => card(k, t, answers[k], noteFor(d, i, k, answers[k]))).join("")}</div>
    ${LOGS()}<footer>${allIn ? `<span class="reveal">${reveal}</span>` : ""}<span style="margin-left:auto">${footerHtml(d)}</span></footer>`;
}

function renderSummary(d) {
  const slots = SLOTS[d.demo], rows = d.answers || [];
  const label = (k) => d.demo === "pmv2" ? `${d.rows[k].row}: ${esc(d.rows[k].question.slice(0, 70))}…` : esc(d.questions[k].question) + (d.questions[k].kind === "control" ? ` <span style="color:var(--full)">(control)</span>` : "");
  const body = rows.map((a, k) => `<tr><td>${label(k)}</td>${slots.map(([s]) => a[s] ? `<td><span class="mark ${a[s].rubric.pass ? "ok" : "bad"}" style="display:inline-grid;width:28px;height:28px;font-size:18px">${a[s].rubric.pass ? "✓" : "✗"}</span> <span class="mono sub">${fmtS(a[s].latency_s)}</span></td>` : "<td></td>").join("")}</tr>`).join("");
  const total = slots.map(([s]) => `<td style="color:var(--${s})">${rows.filter(a => a[s] && a[s].rubric.pass).length}/${rows.length}</td>`).join("");
  const toks = slots.map(([s]) => { const v = rows.filter(a => a[s]); return `<td class="mono sub">${v.length ? fmtN(Math.round(v.reduce((x, a) => x + a[s].prompt_tokens, 0) / v.length)) : ""}</td>`; }).join("");
  return `${header(d, "summary")}<div class="summary" style="flex:none"><table><tr><th>Question</th>${slots.map(([s, t]) => `<th style="color:var(--${s})">${esc(t.split(" · ")[0])}</th>`).join("")}</tr>
    ${body}<tr class="total"><td>Correct</td>${total}</tr><tr><td class="sub">Avg tokens the LLM received</td>${toks}</tr></table></div><footer><span style="margin-left:auto">${footerHtml(d)}</span></footer>`;
}

function renderSanity(d) {
  const i = d.inputs || {};
  const sub = i.document_tokens ? `${i.num_documents} past chats · ${fmtN(i.document_tokens)} tokens of history → <b style="color:var(--memorilla)">16 memory tokens</b>` : "";
  const m = d.methods || {};
  const reveal = i.clue_index != null ? `The only clue is chat ${i.clue_index + 1} of ${i.num_documents}: “${esc(i.clue_excerpt)}”` : "";
  return `${header(d, sub)}<div class="question"><small>PersonaMem-v2 test row ${i.row ?? ""} · the README's own example</small>${esc(i.question || "")}</div>
    <div class="grid c2" style="grid-auto-rows:1fr">${SLOTS.sanity.map(([k, t]) => card(k, t, m[k], noteFor(d, 0, k, m[k]))).join("")}</div>
    ${LOGS()}<footer>${m.memorilla ? `<span class="reveal">${reveal}</span>` : ""}<span style="margin-left:auto">${footerHtml(d)}</span></footer>`;
}

function renderSpeed(d) {
  const sizes = d.sizes, res = d.results || [];
  const pts = { full: [], memorilla: [], memorilla_answer: [] };
  for (const r of res) { if (r.status !== "ok") continue; pts[r.series].push([r.size, r.latency_s]); if (r.series === "memorilla") pts.memorilla_answer.push([r.size, r.generate_s]); }
  const fail = res.filter(r => r.series === "full" && r.status && r.status !== "ok").sort((a, b) => a.size - b.size)[0];
  const W = 1300, H = 760, L = 110, R = 150, T = 40, B = 100;
  const ymax = Math.max(1, ...Object.values(pts).flat().map(p => p[1])) * 1.1;
  const x = s => L + (Math.log2(s) / Math.log2(sizes[sizes.length - 1])) * (W - L - R);
  const y = v => T + (1 - v / ymax) * (H - T - B);
  const step = ymax > 12 ? 5 : ymax > 6 ? 2 : ymax > 2 ? 1 : 0.5;
  let g = "";
  for (let v = 0; v <= ymax; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#30363d"/><text x="${L - 16}" y="${y(v) + 7}" fill="#8b949e" font-size="22" text-anchor="end">${v}</text>`;
  for (const s of sizes) g += `<line x1="${x(s)}" x2="${x(s)}" y1="${T}" y2="${H - B}" stroke="#21262d"/><text x="${x(s)}" y="${H - B + 34}" fill="#8b949e" font-size="22" text-anchor="middle">${s}</text>`;
  g += `<text x="${(L + W - R) / 2}" y="${H - 22}" fill="#e6edf3" font-size="24" text-anchor="middle">documents in the collection (250 tokens each)</text>
    <text transform="translate(34 ${(T + H - B) / 2}) rotate(-90)" fill="#e6edf3" font-size="24" text-anchor="middle">seconds per answer</text>`;
  const col = { full: "var(--full)", memorilla: "var(--memorilla)", memorilla_answer: "#b39ddb" };
  for (const [k, p] of Object.entries(pts)) {
    if (!p.length) continue; p.sort((a, b) => a[0] - b[0]);
    const path = p.map(([s, v], j) => `${j ? "L" : "M"}${x(s)},${y(v)}`).join(" ");
    const dash = k === "memorilla_answer" ? `stroke-dasharray="10 8" stroke-width="4"` : `stroke-width="7"`;
    g += `<path d="${path}" fill="none" stroke="${col[k]}" ${dash} stroke-linejoin="round" stroke-linecap="round"/>`;
    g += p.map(([s, v]) => `<circle cx="${x(s)}" cy="${y(v)}" r="8" fill="${col[k]}"/>`).join("");
    const [ls, lv] = p[p.length - 1];
    g += `<text x="${x(ls) + 16}" y="${y(lv) + 9}" fill="${col[k]}" font-size="28" font-weight="800">${lv.toFixed(2)} s</text>`;
  }
  if (fail) g += `<line x1="${x(fail.size)}" x2="${x(fail.size)}" y1="${T}" y2="${H - B}" stroke="var(--bad)" stroke-width="4" stroke-dasharray="6 8"/>
    <text x="${x(fail.size) - 12}" y="${T + 30}" fill="var(--bad)" font-size="24" text-anchor="end">out of context/VRAM</text>`;
  const by = {}; for (const r of res) by[r.series + r.size] = r;
  const rows = sizes.map(s => { const f = by["full" + s], m = by["memorilla" + s];
    const fc = f ? (f.status === "ok" ? fmtS(f.latency_s) : `<span style="color:var(--bad)">no fit</span>`) : "";
    return `<tr><td class="mono">${s}</td><td class="mono" style="color:var(--full)">${fc}</td><td class="mono" style="color:var(--memorilla)">${m ? fmtS(m.latency_s) : ""}</td><td class="mono sub">${m ? `${m.embed_s.toFixed(2)} + ${m.generate_s.toFixed(2)} s` : ""}</td></tr>`; }).join("");
  const sub = `same question · 1 → ${sizes[sizes.length - 1]} passages of 250 tokens · Qwen3-8B · ${d.config.speed.max_new_tokens} new tokens max`;
  return `${header(d, sub)}<div class="legend"><span><b style="background:var(--full)"></b>Full context</span><span><b style="background:var(--memorilla)"></b>Memorilla, end to end (incl. embedding)</span><span><b style="background:#b39ddb"></b>Memorilla, answering only (paper's definition)</span></div>
    <div class="speed"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>
    <div class="summary"><table><tr><th>docs</th><th>full</th><th>Memorilla</th><th>embed + answer</th></tr>${rows}</table></div></div>
    ${LOGS()}<footer><span style="margin-left:auto">${footerHtml(d)}</span></footer>`;
}

function renderEmpty(msg) { return `<div class="empty">${esc(msg)}</div>`; }

function renderLoading(l) {
  const secs = Math.max(0, Math.round(Date.now() / 1000 - l.since));
  return `<header><h1>${esc(TITLES[l.demo] || l.demo)}</h1><span class="sub">starting up</span><span class="right"><span class="badge live">live run</span></span></header>
    <div class="loading"><div class="big">Loading models <span class="mono">${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}</span></div>
    <div class="sub">Qwen3-8B decoder · Qwen3-Embedding-4B encoder · Memorilla memory module — engine logs below</div>
    <div id="logs" class="logs big"></div></div>`;
}

function updateLogs() {
  const el = document.getElementById("logs");
  if (!el) return;
  const rows = Math.max(6, Math.floor(el.clientHeight / 20.5));
  el.innerHTML = logLines.slice(-rows).map(line => {
    const cls = /\b(ERROR|Error|Traceback|CUDA error)\b/.test(line) ? "e" : /\bWARN(ING)?\b/.test(line) ? "w" : "i";
    return `<div class="${cls}">${esc(line).replace(/^(INFO|WARNING|ERROR|DEBUG)/, "<b>$1</b>")}</div>`;
  }).join("");
}

async function pollLogs() {
  try {
    const j = await (await fetch(`/api/logs?offset=${logOffset}`, { cache: "no-store" })).json();
    if (j.mode === "replay") { logLines = j.lines || []; }
    else if (j.file) {
      if (j.file !== logFile) { logFile = j.file; logLines = []; logPartial = ""; }
      logOffset = j.offset;
      const parts = (logPartial + j.text).split("\n");
      logPartial = parts.pop();
      logLines.push(...parts.filter(x => x.trim()));
      if (logLines.length > 600) logLines = logLines.slice(-400);
    }
    updateLogs();
  } catch (e) { /* keep polling */ }
  setTimeout(pollLogs, 500);
}

function render() {
  const app = document.getElementById("app");
  if (state && state.loading) { app.innerHTML = renderLoading(state.loading); updateLogs(); return; }
  if (!state || !state.data) { app.innerHTML = renderEmpty("Waiting for a demo run…"); return; }
  const d = state.data;
  if (d.error && !(d.answers || d.methods || d.results)) { app.innerHTML = renderEmpty(`Run failed: ${d.error.stage} · ${d.error.type}`); return; }
  if (d.demo === "speed") app.innerHTML = renderSpeed(d);
  else if (d.demo === "sanity") app.innerHTML = d.inputs ? renderSanity(d) : renderEmpty("Loading models…");
  else if (!(d.answers || []).length) app.innerHTML = renderEmpty("Loading models…");
  else app.innerHTML = view.summary ? renderSummary(d) : renderBoard(d);
  updateLogs();
}

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const text = await r.text();
    if (text !== lastText) {
      lastText = text; state = JSON.parse(text);
      const d = state.data;
      if (d && d.answers && SLOTS[d.demo]) {
        if (complete(d) && !view.doneAt) view.doneAt = Date.now();
        if (!complete(d)) { view.doneAt = 0; if (view.follow) view.summary = false; }
      }
      render();
    }
    if (view.doneAt && view.follow && !view.summary && Date.now() - view.doneAt > 8000) { view.summary = true; render(); }
    if (state && state.loading) render();
  } catch (e) { /* server restarting; keep polling */ }
  setTimeout(poll, 600);
}

document.addEventListener("keydown", e => {
  const d = state && state.data;
  if (e.key === "ArrowLeft" && d) { view.follow = false; view.summary = false; view.index = Math.max(0, (view.index ?? 0) - 1); }
  else if (e.key === "ArrowRight" && d) { view.follow = false; view.summary = false; view.index = Math.min(answeredCount(d) - 1, (view.index ?? 0) + 1); }
  else if (e.key === "f" || e.key === "F") { view.follow = true; view.summary = false; }
  else if (e.key === "s" || e.key === "S") { view.summary = !view.summary; }
  else if (e.key === "b" || e.key === "B") { view.badge = !view.badge; }
  else if (e.key === "l" || e.key === "L") { view.logs = !view.logs; }
  else if (e.key === "r" || e.key === "R") { fetch("/api/restart"); view = { ...view, follow: true, summary: false, doneAt: 0 }; lastText = ""; }
  else return;
  render();
});
poll();
pollLogs();
</script>
</body>
</html>
